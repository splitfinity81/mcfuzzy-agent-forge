version: 2

# This repo has no root package.json - each package is installed and tested from
# its own directory, so every package needs its own entry here. Updates are
# grouped per package so a routine bump is one pull request, not a dozen.
#
# templates/skills/forge-build-agent-team is deliberately absent: it declares no
# dependencies and ships no lockfile, so there is nothing for Dependabot to do.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /scripts/forge-launcher
    schedule:
      interval: weekly
    groups:
      forge-launcher:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /templates/skills/forge-execution-adapter
    schedule:
      interval: weekly
    groups:
      forge-execution-adapter:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /templates/skills/forge-workflow-engine
    schedule:
      interval: weekly
    groups:
      forge-workflow-engine:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /templates/skills/forge-workforce-compiler
    schedule:
      interval: weekly
    groups:
      forge-workforce-compiler:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /templates/skills/skill-review
    schedule:
      interval: weekly
    groups:
      skill-review:
        patterns:
          - "*"
